<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="55%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Studio Canvas -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#studioBg)" />
  <path d="M0 116 C0 52 52 0 116 0 H396 C460 0 512 52 512 116 V220 C380 265 132 265 0 220 Z" fill="url(#sheen)" />

  <!-- Outer Crisp Shield -->
  <path
    d="M256 76 L404 130 V248 C404 338 338 406 256 436 C174 406 108 338 108 248 V130 Z"
    fill="url(#shieldFill)"
    stroke="#FFFFFF"
    stroke-width="20"
    stroke-linejoin="round"
  />

  <!-- Subtle Inner Pitch Field Ring & Half Line -->
  <circle cx="256" cy="248" r="76" fill="none" stroke="#34D399" stroke-opacity="0.28" stroke-width="6" />
  <line x1="126" y1="248" x2="386" y2="248" stroke="#34D399" stroke-opacity="0.22" stroke-width="5" />

  <!-- Monogram M + Tactical Chevron -->
  <path
    d="M174 304 V190 L256 268 L338 190 V304"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="34"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Center Ball / Tactical Node Accent -->
  <circle cx="256" cy="342" r="20" fill="#FBBF24" stroke="#FFFFFF" stroke-width="6" />
</svg>
